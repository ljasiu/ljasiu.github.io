<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>360° Auckland | Photography</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      overflow: hidden; background: #050505; color: #fff;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    }
    main { width: min(100%, 1100px); padding: 5vw 4vw; text-align: center; }
    .mark { position: relative; display: inline-block; isolation: isolate; }
    .number {
      display: block; font-size: clamp(9rem, 31vw, 25rem);
      line-height: .78; letter-spacing: -.075em; font-weight: 900;
      color: #fff; white-space: nowrap;
    }
    .degree {
      position: absolute; top: -.07em; right: -.18em;
      font: 900 clamp(1.6rem, 5.2vw, 4.2rem)/1 Arial, sans-serif;
      letter-spacing: 0; color: #fff;
    }
    .city {
      position: relative; z-index: 1; margin: -.035em 0 0;
      color: #ffd900; font-family: "Brush Script MT", "Segoe Script", cursive;
      font-size: clamp(3.8rem, 14vw, 11rem); font-weight: 900;
      font-style: italic; line-height: .9; letter-spacing: -.055em;
      text-transform: uppercase; transform: rotate(-4deg);
      text-shadow: 2px 2px 0 #ffd900;
    }
    .tagline {
      margin: clamp(2rem, 6vw, 4rem) 0 0; color: #888;
      font: 600 .72rem/1.4 Arial, sans-serif; letter-spacing: .32em;
      text-transform: uppercase;
    }
    @media (max-width: 480px) {
      .number { font-size: 34vw; }
      .city { font-size: 15vw; }
      .tagline { letter-spacing: .2em; }
    }
  </style>
</head>
<body>
  <main aria-label="360 degrees Auckland photography">
    <div class="mark">
      <span class="number">360</span>
      <span class="degree">°</span>
      <h1 class="city">Auckland</h1>
    </div>
    <p class="tagline">Photography · Auckland, New Zealand</p>
  </main>
</body>
</html>
